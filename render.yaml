services:
  - type: web
    name: intervio-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: INTERVIEW_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
    plan: free
    region: oregon
